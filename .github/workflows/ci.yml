name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      model_source:
        description: Model to evaluate
        type: choice
        options: [release, base]
        default: base

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint and test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Lint
        run: python -m pyflakes worker service training scripts tools
      - name: Unit tests
        run: python -m pytest -q
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  model-evaluation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model evaluation dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.44.2 tokenizers==0.19.1 numpy==1.26.4
      - name: Download trained model from Release
        if: inputs.model_source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models/v1
          gh release download model-v1 --pattern v1.tar.gz --dir models --repo "${{ github.repository }}"
          tar -xzf models/v1.tar.gz -C models/v1
      - name: Evaluate model
        run: |
          if [ "${{ inputs.model_source }}" = "base" ]; then
            MODEL=EleutherAI/pythia-70m
          else
            MODEL=models/v1
          fi
          python training/predict.py --model "$MODEL" --input data/validation.jsonl --out results/ci_predictions.jsonl
      - name: Quality gate
        run: python tools/score.py results/ci_predictions.jsonl data/validation.jsonl --min-validity 95
